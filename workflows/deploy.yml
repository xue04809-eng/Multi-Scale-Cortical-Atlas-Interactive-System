
name: Deploy Brain Atlas Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. 获取 GitHub 仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. 安装项目依赖
      - name: Install dependencies
        run: npm install

      # 4. 执行 Webpack 生产构建
      - name: Build frontend
        run: npm run build

      # 5. 将 public 中的文件复制到 dist
      - name: Copy public assets
        run: |
          mkdir -p dist
          cp -R public/. dist/

      # 6. 配置 GitHub Pages
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # 7. 上传 dist 作为部署文件
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 8. 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
